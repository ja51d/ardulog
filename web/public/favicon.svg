<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2540"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="craft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#3da9fc"/>
      <stop offset="1"   stop-color="#1e6fb8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be4ff"/>
      <stop offset="1" stop-color="#5cb8ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Faint flight-path arc behind craft, hints at "log viewer" -->
  <path d="M 10 50 Q 32 30 54 50"
        fill="none" stroke="#3da9fc" stroke-opacity="0.25"
        stroke-width="1.2" stroke-linecap="round"/>

  <!-- Delta-wing UAV, top-down. Long swept wings + slim fuselage + V-tail. -->
  <g fill="url(#craft)">
    <!-- Swept wings (delta) -->
    <path d="M 32 18
             L 56 44
             L 38 40
             L 32 50
             L 26 40
             L 8 44 Z"/>
  </g>
  <!-- Fuselage spine -->
  <path d="M 32 16 L 32 50"
        stroke="url(#accent)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- V-tail fins -->
  <g fill="url(#accent)">
    <path d="M 32 47 L 28 54 L 32 51 Z"/>
    <path d="M 32 47 L 36 54 L 32 51 Z"/>
  </g>
  <!-- Nose canopy / sensor dot -->
  <circle cx="32" cy="22" r="2.6" fill="#e0f2fe"/>
</svg>
